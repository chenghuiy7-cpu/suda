<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="178mm" height="89mm" viewBox="0 0 1600 800" version="1.1" role="img" aria-labelledby="title desc">
  <title id="title">FHEStore with explicit host-controlled execution and ciphertext relays</title>
  <desc id="desc">Three columns show FHEStore computational storage, host software, and a remote FHE service. The host application invokes a task runtime describing an operator graph, contexts, and memory ranges. Dashed control arrows submit a task to the device runtime, which configures FPGA operators. The upper solid data path runs from persistent storage through optional preprocessing and FPGA encoding/encryption, through the host input ciphertext relay, to the remote FHE service. Result ciphertexts traverse the lower path in the opposite direction through the host result ciphertext relay, FPGA decryption/decoding, and write-back to the same persistent store.</desc>
  <metadata>Editable SVG reconstructed using design-reference.png; no embedded raster. Functional overview, 178 x 89 mm. Minimum font: 26 viewBox units, 8.20 pt. Write-back includes host-assisted record merging where required.</metadata>
