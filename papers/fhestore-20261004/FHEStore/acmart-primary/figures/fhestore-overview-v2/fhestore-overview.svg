    </marker>
    <marker id="arrow-control" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11.8" refY="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0,0 L 12,6 L 0,12 Z" fill="#707982" />
