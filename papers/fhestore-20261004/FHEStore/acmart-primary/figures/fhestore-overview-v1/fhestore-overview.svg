<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="178mm" height="89mm" viewBox="0 0 1600 800" version="1.1" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">FHEStore functional system overview</title>
  <desc id="figure-description">Host application task runtime controls FHEStore through task, graph, and parameter descriptions. Within FHEStore, persistent data enters optional preprocessing followed by FPGA encoding and encryption. Input ciphertexts are transferred through the host to a remote FHE service containing an HPU. Result ciphertexts return through the host for FPGA decryption and decoding. Write-back returns recovered results to the same persistent storage. Solid arrows show data flow; a dashed arrow shows task control.</desc>
  <metadata>Fully editable vector reconstruction of design-reference.png. Target placement: two-column-spanning, 178 mm x 89 mm. Minimum text size: 26 SVG units = approximately 8.20 pt at target width. Functional grouping does not assert that every Write-back operation runs exclusively on the device. See the companion caption for host-assisted merging.</metadata>
