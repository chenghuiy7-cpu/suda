[package]
name = "suda-lwe-keygen"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
bincode = "1.3.3"
clap = { version = "4.4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
tfhe = { path = "../tfhe-rs/tfhe", default-features = false, features = ["hpu-v80"] }
tfhe-hpu-backend = { path = "../tfhe-rs/backends/tfhe-hpu-backend", features = ["hw-v80"] }

[workspace]
